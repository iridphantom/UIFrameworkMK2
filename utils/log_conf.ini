[log]
# 日志基础目录（相对于项目根目录的路径）
log_dir = logs

[logger_root]
level = DEBUG
handlers = console, file

# 控制台输出
[handler_console]
class = StreamHandler
level = DEBUG
formatter = default


# 文件输出
[handler_file]
class = FileHandler
level = INFO
formatter = default
# 文件名模板（动态替换日期，实际路径由代码生成）
filename = {date}.log


# formatter 定义
[formatter_default]
format = %(levelname)s - %(asctime)s - %(filename)s - %(module)s - %(funcName)s - %(lineno)s : %(message)s
datefmt = %Y-%m-%d %H:%M:%S